<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="rGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
    <marker id="rDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1280" height="500" fill="#0d1117"/>
  <rect x="8" y="8" width="1264" height="484" rx="16" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- title -->
  <text x="60" y="52" font-size="26" font-weight="700" fill="#e6edf3">The autonomous runner</text>
  <text x="60" y="76" font-size="13" fill="#8b949e">loop-run applies the task loop across a backlog, unattended — merging always stays yours</text>

  <!-- ===== flow row ===== -->
  <!-- 1 backlog source -->
  <rect x="60" y="150" width="190" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="155" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Backlog source</text>
  <text x="155" y="209" text-anchor="middle" font-size="11" fill="#8b949e">file · GitHub · Jira</text>
  <text x="155" y="236" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#c9d1d9">list → {id, …, skip}</text>
  <text x="155" y="254" text-anchor="middle" font-size="10" fill="#6e7681">skip: loop:manual / loop:blocked</text>

  <!-- 2 loop-run -->
  <rect x="302.5" y="150" width="190" height="120" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="2"/>
  <text x="397.5" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">loop-run</text>
  <text x="397.5" y="216" text-anchor="middle" font-size="11" fill="#8b949e">pick next ready item</text>
  <text x="397.5" y="236" text-anchor="middle" font-size="11" fill="#8b949e">(triage, then loop)</text>

  <!-- 3 loop-task cycle -->
  <rect x="545" y="150" width="190" height="120" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="640" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">loop-task cycle</text>
  <text x="640" y="209" text-anchor="middle" font-size="10.5" fill="#8b949e">rubric→verifier→gate→commit</text>
  <text x="640" y="236" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#c9d1d9">on loop/&lt;id&gt; branch</text>

  <!-- 4 write-back -->
  <rect x="787.5" y="150" width="190" height="120" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="882.5" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">write-back</text>
  <text x="882.5" y="209" text-anchor="middle" font-size="11" fill="#8b949e">comment · draft PR</text>
  <text x="882.5" y="236" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#c9d1d9">Closes #&lt;id&gt;</text>

  <!-- 5 human merge -->
  <rect x="1030" y="150" width="190" height="120" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="1125" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">you review &amp; merge</text>
  <text x="1125" y="209" text-anchor="middle" font-size="11" fill="#8b949e">platform auto-closes</text>
  <text x="1125" y="229" text-anchor="middle" font-size="11" fill="#8b949e">the linked issue</text>

  <!-- horizontal arrows -->
  <path d="M250,210 L297,210" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#rGray)"/>
  <text x="273" y="201" text-anchor="middle" font-size="11" font-weight="600" fill="#8b949e">list</text>

  <path d="M492.5,210 L540,210" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#rGray)"/>
  <text x="516" y="201" text-anchor="middle" font-size="11" font-weight="600" fill="#8b949e">each item</text>

  <path d="M735,210 L782,210" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#rGray)"/>
  <text x="758" y="201" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">verified ✓</text>

  <path d="M977.5,210 L1025,210" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#rGray)"/>
  <text x="1001" y="201" text-anchor="middle" font-size="11" font-weight="600" fill="#f0883e">draft PR</text>

  <!-- next-item loop back (write-back → loop-run) -->
  <path d="M882.5,270 C820,338 460,338 397.5,272" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rDash)"/>
  <text x="640" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#8b949e">next item — until the cap (default 3)</text>

  <!-- safety note -->
  <rect x="60" y="392" width="1160" height="72" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="84" y="422" font-size="13" font-weight="700" fill="#e6edf3">Safety</text>
  <text x="84" y="446" font-size="11.5" fill="#8b949e">loop-run never pushes or merges the default branch — that is always you. Feature-branch push happens only in draft-pr mode (opt-in). An item it can't finish gets loop:blocked and is skipped next run.</text>
</svg>
