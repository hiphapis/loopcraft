<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="vaultStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <marker id="aGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
    <marker id="aCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1280" height="710" fill="#0d1117"/>
  <rect x="8" y="8" width="1264" height="694" rx="16" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- title -->
  <text x="60" y="44" font-size="26" font-weight="700" fill="#e6edf3">How Loopcraft works</text>
  <text x="60" y="68" font-size="13" fill="#8b949e">a self-correction loop + memory that survives sessions</text>

  <!-- legend -->
  <circle cx="936" cy="40" r="6" fill="#f0883e"/><text x="948" y="45" font-size="13" fill="#8b949e">Hook</text>
  <circle cx="1012" cy="40" r="6" fill="#38bdf8"/><text x="1024" y="45" font-size="13" fill="#8b949e">Skill</text>
  <circle cx="1086" cy="40" r="6" fill="#a371f7"/><text x="1098" y="45" font-size="13" fill="#8b949e">Verifier</text>

  <!-- ===== memory vault ===== -->
  <rect x="330" y="90" width="620" height="96" rx="12" fill="#161b22" stroke="url(#vaultStroke)" stroke-width="2"/>
  <text x="366" y="122" font-size="15" font-weight="700" fill="#e6edf3">MEMORY VAULT<tspan font-size="12" font-weight="400" fill="#8b949e">  ·  .loop/memory  (committed to the repo)</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c9d1d9">
    <rect x="366" y="148" width="128" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="430" y="165" text-anchor="middle">INDEX.md</text>
    <rect x="506" y="148" width="128" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="570" y="165" text-anchor="middle">STATE.md</text>
    <rect x="646" y="148" width="128" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="710" y="165" text-anchor="middle">LEDGER.md</text>
    <rect x="786" y="148" width="128" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="850" y="165" text-anchor="middle">notes/*.md</text>
  </g>

  <!-- inject arrow (hook) -->
  <path d="M420,186 C300,235 205,268 158,318" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#aOrange)"/>
  <text x="232" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e">inject</text>
  <text x="232" y="262" text-anchor="middle" font-size="10" fill="#8b949e">INDEX + STATE + ledger</text>

  <!-- distill arrow (skill) -->
  <path d="M1052,318 C1000,262 928,224 852,186" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#aCyan)"/>
  <text x="1052" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#38bdf8">distill</text>
  <text x="1052" y="262" text-anchor="middle" font-size="10" fill="#8b949e">fail→investigate→verify</text>

  <!-- ===== work cycle ===== -->
  <!-- 1 SessionStart (hook) -->
  <rect x="60" y="320" width="190" height="110" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <circle cx="82" cy="342" r="12" fill="#f0883e"/><text x="82" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text>
  <text x="155" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">SessionStart</text>
  <text x="155" y="396" text-anchor="middle" font-size="11" fill="#8b949e">inject memory into context</text>

  <!-- 2 loop-task (skill) -->
  <rect x="302.5" y="320" width="190" height="110" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="324.5" cy="342" r="12" fill="#38bdf8"/><text x="324.5" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text>
  <text x="397.5" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">loop-task</text>
  <text x="397.5" y="396" text-anchor="middle" font-size="11" fill="#8b949e">Maker produces output</text>

  <!-- 3 verifier (subagent) -->
  <rect x="545" y="320" width="190" height="110" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <circle cx="567" cy="342" r="12" fill="#a371f7"/><text x="567" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text>
  <text x="640" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">verifier</text>
  <text x="640" y="396" text-anchor="middle" font-size="11" fill="#8b949e">grade vs rubric</text>

  <!-- 4 gate -->
  <rect x="787.5" y="320" width="190" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <circle cx="809.5" cy="342" r="12" fill="#d29922"/><text x="809.5" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text>
  <text x="882.5" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">gate</text>
  <text x="882.5" y="396" text-anchor="middle" font-size="11" fill="#8b949e">tests · typecheck</text>

  <!-- 5 commit -->
  <rect x="1030" y="320" width="190" height="110" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="1052" cy="342" r="12" fill="#3fb950"/><text x="1052" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">5</text>
  <text x="1125" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">commit</text>
  <text x="1125" y="396" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#8b949e">Loop-Verified: n/m</text>

  <!-- horizontal arrows -->
  <path d="M250,375 L297,375" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#aGray)"/>
  <path d="M492.5,375 L540,375" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#aGray)"/>
  <path d="M735,375 L782,375" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="758" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">pass ✓</text>
  <path d="M977.5,375 L1025,375" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#aGray)"/>

  <!-- retry loop (fail) -->
  <path d="M600,430 C560,502 462,502 420,432" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aRed)"/>
  <text x="510" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#f85149">✗ fail → retry  (≤ maxRetries)</text>

  <!-- ===== guardrails ===== -->
  <text x="180" y="566" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1">SESSION GUARDRAILS · enforced by hooks</text>
  <rect x="180" y="580" width="420" height="105" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="204" y="614" font-size="15" font-weight="700" fill="#e6edf3">Stop gate</text>
  <text x="204" y="638" font-size="11.5" fill="#8b949e">changed code + stale STATE.md</text>
  <text x="204" y="658" font-size="11.5" fill="#8b949e">→ blocks exit once (never a lock-in)</text>

  <rect x="680" y="580" width="420" height="105" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="704" y="614" font-size="15" font-weight="700" fill="#e6edf3">PreCompact</text>
  <text x="704" y="638" font-size="11.5" fill="#8b949e">persist progress to STATE.md</text>
  <text x="704" y="658" font-size="11.5" fill="#8b949e">before context summarization</text>
</svg>
